# Nginx reverse proxy config สำหรับ rojpaiboon.com
# วิธีใช้บน VPS:
#   sudo cp deploy/nginx/rojpaiboon.com.conf /etc/nginx/sites-available/rojpaiboon.com
#   sudo ln -s /etc/nginx/sites-available/rojpaiboon.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rojpaiboon.com -d www.rojpaiboon.com
# certbot จะแก้ไฟล์นี้อัตโนมัติเพื่อเพิ่ม listen 443 ssl + redirect http -> https

server {
    listen 80;
    listen [::]:80;
    server_name rojpaiboon.com www.rojpaiboon.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ส่งข้อมูล request จริงให้แอป (จำเป็นสำหรับ trust proxy / secure cookie)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # รองรับ websocket ถ้ามีใช้งานในอนาคต
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
